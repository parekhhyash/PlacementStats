<!DOCTYPE html>
<html lang="en" class="h-full bg-bg text-fg CWomsa_variable Z1YhAq_variable _0T2Ldq_variable">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Selections · Placed · SPIT</title>
  <meta name="description" content="Campus recruitment, roles, pay and selection analytics." />
  <meta name="theme-color" content="#000000" />
  
  <!-- Google Fonts Preconnect & Stylesheet -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Geist:wght@300..800&family=Geist+Mono:wght@400..700&display=swap" rel="stylesheet" />

  <!-- Local Font Preloads -->
  <link rel="preload" href="/fonts/FunnelDisplay-s.p.2xty_ze311ap2.woff2" as="font" type="font/woff2" crossorigin="" />
  <link rel="preload" href="/fonts/Geist-s.p.2xgg6xh-upisd.woff2" as="font" type="font/woff2" crossorigin="" />
  <link rel="preload" href="/fonts/GeistMono-s.p.1r21m8mjt8-gs.woff2" as="font" type="font/woff2" crossorigin="" />
  
  <!-- Styles -->
  <link rel="stylesheet" href="/css/styles.css" />
  <link rel="icon" href="/favicon.ico" sizes="48x48" />
  <link rel="icon" href="/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  
</head>
<body class="min-h-full bg-bg font-sans text-fg antialiased flex flex-col justify-between selection:bg-fg selection:text-bg">
  <div id="site-header-root"></div>

  <main class="flex-1">
    
    <section class="wrap pb-12 pt-[clamp(48px,8vw,112px)]">
      <p id="selections-page-badge" class="label text-muted">Offers · SPIT 2027</p>
      <h1 class="display-l mt-6 max-w-[16ch]">Who got placed.</h1>
    </section>

    <div class="wrap">
      <!-- 5-Column Headline Metrics -->
      <dl id="selections-headline-grid" class="grid grid-cols-2 border-t border-line sm:grid-cols-5">
        <!-- Rendered dynamically -->
      </dl>

      <!-- Section 01: Placed by Branch -->
      <section class="mt-20">
        <div class="border-t border-line pt-6">
          <p class="label text-faint">01 — Distribution</p>
          <h2 class="display-m mt-3">Placed, by branch</h2>
        </div>

        <div id="branch-bars" class="mt-8 grid gap-5">
          <!-- Rendered dynamically -->
        </div>
      </section>

      <!-- Section 02: Offers by Company -->
      <section class="mt-20">
        <div class="border-t border-line pt-6 flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
          <div>
            <p class="label text-faint">02 — Companies</p>
            <h2 class="display-m mt-3">Selections by company</h2>
          </div>
          <div class="flex items-center gap-4 text-[12px] text-muted">
            <span class="flex items-center gap-1.5"><i class="dot" style="background:var(--color-ppo)"></i> PPO / Dual</span>
            <span class="flex items-center gap-1.5"><i class="dot" style="background:var(--color-fulltime)"></i> Full-time</span>
            <span class="flex items-center gap-1.5"><i class="dot" style="background:var(--color-intern)"></i> Internship</span>
          </div>
        </div>

        <div id="company-offers-list" class="mt-8 divide-y divide-line">
          <!-- Rendered dynamically -->
        </div>
      </section>
    </div>
  
  </main>

  <div id="site-footer-root"></div>
  <div id="story-modal-root"></div>

  <!-- Shared Application Scripts -->
  <script type="module">
    import { siteConfig } from '/src/config/site.js';
    import { renderHeader, initHeader } from '/src/components/header.js';
    import { renderFooter, initFooter } from '/src/components/footer.js';
    import { renderStoryModal, initStoryModal } from '/src/components/story-modal.js';

    document.getElementById('site-header-root').innerHTML = renderHeader('/selections/');
    document.getElementById('site-footer-root').innerHTML = renderFooter();
    document.getElementById('story-modal-root').innerHTML = renderStoryModal();

    initHeader();
    initFooter();
    initStoryModal();

    
    import { getActiveBatchData, getBatchKey } from '/src/data/batches.js';

    const batch = getActiveBatchData();
    const is2028 = batch.year === '2028';
    const branches = batch.branches || [];
    const companies = batch.companies || [];

    // Header badge
    const badgeEl = document.getElementById('selections-page-badge');
    if (badgeEl) badgeEl.textContent = `Offers · SPIT Class of ${batch.year}`;

    // Headline metrics
    const headlineEl = document.getElementById('selections-headline-grid');
    if (headlineEl) {
      headlineEl.innerHTML = `
        <div class="flex flex-col border-b border-line py-5 pr-4 sm:border-b-0 sm:border-r sm:px-5 sm:first:pl-0">
          <dt class="order-2 mt-2 text-muted text-[13px]">Total Confirmed Offers</dt>
          <dd class="num order-1 font-display text-[clamp(28px,2.8vw,44px)] leading-none text-fg">${batch.stats.studentsPlaced}</dd>
          <dd class="label order-3 mt-1 text-[11px] text-faint">Across all ${companies.length} firms</dd>
        </div>
        <div class="flex flex-col border-b border-line py-5 pr-4 sm:border-b-0 sm:border-r sm:px-5">
          <dt class="order-2 mt-2 text-muted text-[13px]">Full-time & Dual</dt>
          <dd class="num order-1 font-display text-[clamp(28px,2.8vw,44px)] leading-none text-fg">${batch.stats.fulltimeOffersCount}</dd>
          <dd class="label order-3 mt-1 text-[11px] text-faint">Direct FT + Dual offers</dd>
        </div>
        <div class="flex flex-col border-b border-line py-5 pr-4 sm:border-b-0 sm:border-r sm:px-5">
          <dt class="order-2 mt-2 text-muted text-[13px]">Internship Only</dt>
          <dd class="num order-1 font-display text-[clamp(28px,2.8vw,44px)] leading-none text-fg">${batch.stats.internshipsCount}</dd>
          <dd class="label order-3 mt-1 text-[11px] text-faint">Summer internships</dd>
        </div>
        <div class="flex flex-col border-b border-line py-5 pr-4 sm:border-b-0 sm:border-r sm:px-5">
          <dt class="order-2 mt-2 text-muted text-[13px]">Dual / PPO Pathway</dt>
          <dd class="num order-1 font-display text-[clamp(28px,2.8vw,44px)] leading-none text-fg">${batch.stats.ppoCount}</dd>
          <dd class="label order-3 mt-1 text-[11px] text-faint">Internship + FT conversion</dd>
        </div>
        <div class="flex flex-col py-5 pr-4 sm:px-5">
          <dt class="order-2 mt-2 text-muted text-[13px]">Placement Rate</dt>
          <dd class="num order-1 font-display text-[clamp(28px,2.8vw,44px)] leading-none text-fg">${batch.stats.placementPercentage}</dd>
          <dd class="label order-3 mt-1 text-[11px] text-faint">Batch '${batch.year.slice(2)}</dd>
        </div>
      `;
    }

    // Render branch bars
    const branchBarsEl = document.getElementById('branch-bars');
    const filteredBranches = branches.filter(b => b.id !== 'all');

    branchBarsEl.innerHTML = filteredBranches.map(b => `
      <div class="rounded-2xl border border-line bg-panel p-5">
        <div class="flex items-center justify-between text-[15px] font-medium">
          <span class="flex items-center gap-2.5">
            <i class="dot size-2.5" style="background:${b.color}"></i>
            ${b.name} (${b.shortName})
          </span>
          <span class="num text-fg">${b.placedStudents} / ${b.totalStudents} placed (${b.placedPercentage}%)</span>
        </div>
        <div class="mt-3 h-3 w-full bg-line rounded-full overflow-hidden">
          <div class="h-full rounded-full transition-all duration-700" style="width: ${b.placedPercentage}%; background: ${b.color}"></div>
        </div>
      </div>
    `).join('');

    // Render companies with selections
    const companyListEl = document.getElementById('company-offers-list');
    const sorted = [...companies].sort((a, b) => (b.out?.students || 0) - (a.out?.students || 0));

    companyListEl.innerHTML = sorted.map(c => {
      const out = c.out || { students: 0, fulltimeOffers: 0, internships: 0, ppo: 0 };
      const logo = c.logo ? `<img src="${c.logo}" class="size-6 object-contain rounded" />` : '';

      return `
        <div class="py-4 flex flex-col sm:flex-row sm:items-center justify-between gap-4 hover:bg-panel px-2 rounded-xl transition-colors">
          <div class="flex items-center gap-3 min-w-[200px]">
            ${logo}
            <a href="/companies/company.html?slug=${c.slug}${is2028 ? '&batch=2028' : ''}" class="font-display text-[17px] font-medium text-fg hover:underline">${c.name}</a>
          </div>

          <div class="flex items-center gap-6 text-[13px]">
            <span class="num text-fg font-semibold min-w-[80px]">${out.students} placed</span>
            <div class="flex items-center gap-2">
              ${out.fulltimeOffers > 0 ? `<span class="chip"><i class="dot" style="background:var(--color-fulltime)"></i>${out.fulltimeOffers} FT</span>` : ''}
              ${out.internships > 0 ? `<span class="chip"><i class="dot" style="background:var(--color-intern)"></i>${out.internships} Intern</span>` : ''}
              ${out.ppo > 0 ? `<span class="chip"><i class="dot" style="background:var(--color-ppo)"></i>${out.ppo} PPO</span>` : ''}
            </div>
            <span class="label text-muted min-w-[90px] text-right hidden md:inline">${c.pay || ''}</span>
          </div>
        </div>
      `;
    }).join('');
  
  </script>
</body>
</html>
